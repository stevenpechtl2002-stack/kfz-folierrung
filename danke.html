<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Anfrage gesendet – DagliogluLackierungen</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0d; color: #fff; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1.5rem; text-align: center;
    }
    .card {
      background: #141414; border: 1px solid #222; border-radius: 28px;
      padding: 3.5rem 3rem; max-width: 460px; width: 100%;
    }
    .ico {
      width: 72px; height: 72px; margin: 0 auto 1.75rem;
      background: linear-gradient(135deg, #e53e3e, #fc8181);
      border-radius: 20px; display: flex; align-items: center;
      justify-content: center; font-size: 2rem;
      box-shadow: 0 16px 40px rgba(229,62,62,.3);
    }
    h1 { font-size: 1.9rem; font-weight: 400; letter-spacing: .04em; margin-bottom: 1rem; }
    p { color: rgba(255,255,255,.5); line-height: 1.75; font-size: .95rem; margin-bottom: 2rem; }
    a {
      display: inline-block; background: #fff; color: #0d0d0d;
      text-decoration: none; padding: 1rem 2rem; border-radius: 14px;
      font-weight: 800; letter-spacing: .3px; transition: all .25s;
    }
    a:hover { background: #e53e3e; color: #fff; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="card">
    <div class="ico">✅</div>
    <h1>Anfrage gesendet</h1>
    <p>Vielen Dank! Deine Buchungsanfrage ist bei uns eingegangen. Wir melden uns innerhalb von 2 Stunden (während der Öffnungszeiten) mit einem Terminvorschlag.</p>
    <a href="/">Zurück zur Startseite</a>
  </div>
</body>
</html>
